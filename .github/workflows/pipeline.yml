name: Universal Enterprise Pipeline

on:
  push:
    paths:
      - 'data/raw/**'
      - 'main.py'
      - 'utils/**'
      - 'industries/**'
  workflow_dispatch:        

jobs:
  analyze_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openai openpyxl matplotlib seaborn

      - name: 🚀 Run Master Orchestrator (main.py)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python main.py

      - name: Save AI Strategy Report to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p data/outputs/reports/
          mkdir -p data/outputs/charts/
          mkdir -p data/outputs/logs/
          git add --force data/outputs/
          git commit -m "🤖 Auto-generated AI Strategy Report" || echo "No new reports to commit"
          git push
