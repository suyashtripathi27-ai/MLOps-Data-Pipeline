name: Run Master Orchestrator Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy openpyxl openrouter openai matplotlib seaborn

    - name: Execute Master Orchestrator
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python main.py

    - name: Save AI Strategy Report to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        mkdir -p data/outputs/reports/
        mkdir -p data/outputs/charts/
        mkdir -p data/outputs/logs/
        git add --force data/outputs/
        git commit -m "🤖 Auto-generated AI Strategy Report" || echo "No new reports to commit"
        
        # Pull down remote changes with a rebase to avoid push rejections
        git pull --rebase origin main
        
        # Securely push the unified changes
        git push origin main
