name: Universal AI Data Pipeline

on:
  push:
    paths:
      - 'data/raw/*.csv'
      - 'data/raw/*.xlsx'
      - 'data/raw/*.zip'
      - 'scripts/pipeline_engine.py'
  workflow_dispatch: 
      
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas openpyxl openai
      - run: python scripts/pipeline_engine.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/processed/
          git commit -m "🤖 Universal AI Analysis Complete" || echo "No changes"
          git push
