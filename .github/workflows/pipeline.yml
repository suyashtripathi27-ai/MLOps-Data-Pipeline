name: Run Master Orchestrator Pipeline

on:
  # 1. MANUAL TRIGGER: Adds a "Run workflow" button in the GitHub Actions tab
  workflow_dispatch: 

  # 2. FOLDER TRIGGER: Only runs when a file is added/modified in the raw folder
  push:
    paths:
      - 'data/raw/**'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy openpyxl openai matplotlib seaborn rapidfuzz google-generativeai tenacity pydantic

    - name: Execute Master Orchestrator
      env:
        # 🛡️ BOTH KEYS EXPOSED: Allows the Multi-API Router to seamlessly fallback
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      run: |
        python main.py

    - name: Commit and Push AI Reports
      run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action Bot"
          
          # 1. Explicitly turn off rebasing (This prevents your specific error!)
          git config pull.rebase false
          
          # 2. Add and commit the new report
          git add data/outputs/reports/
          git commit -m "🤖 Auto-generated AI Strategy Report" || echo "No changes to commit"
          
          # 3. Pull latest changes and FORCE the runner's file to win (-X ours)
          git pull origin main -s recursive -X ours
          
          # 4. Push safely to the repository
          git push
