name: Run Master Orchestrator Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "data/raw/**"
      - ".github/workflows/pipeline.yml"
      - "main.py"
      - "utils/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Master Orchestrator
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python main.py

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-outputs
        path: |
          data/outputs/
        retention-days: 30

    - name: Commit & Push Generated Reports
      if: success() && github.actor != 'dependabot[bot]'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        mkdir -p data/outputs/reports/
        mkdir -p data/outputs/charts/
        mkdir -p data/outputs/logs/
        
        # Only stage intended output files, not directory contents
        git add data/outputs/reports/ data/outputs/charts/ data/outputs/logs/ || true
        
        if ! git diff-index --quiet HEAD --; then
          git commit -m "🤖 Auto-generated AI Strategy Report [skip ci]"
          git pull --rebase origin main
          git push origin main
        else
          echo "✓ No new reports to commit"
        fi
