name: Run Master Orchestrator Pipeline

on:
  # 1. MANUAL TRIGGER: Adds a "Run workflow" button in the GitHub Actions tab
  workflow_dispatch: 

  # 2. FOLDER TRIGGER: Only runs when a file is added/modified in the raw folder
  push:
    paths:
      - 'data/raw/**'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy openpyxl openai matplotlib seaborn rapidfuzz google-generativeai tenacity pydantic

    - name: Execute Master Orchestrator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      run: |
        python evaluation/build_suite.py
        python main.py

    - name: Commit and Push AI Reports, Charts & Telemetry
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action Bot"
        
        # 1. Turn off rebasing
        git config pull.rebase false
        
        # 2. Add reports, generated charts, telemetry, and the processed-file manifest
        git add data/outputs/reports/
        git add data/outputs/charts/      #
        git add evaluation/results/
        git add data/outputs/logs/.processed_manifest.json
        
        git commit -m "🤖 Auto-generated AI Strategy Report, Charts & Telemetry" || echo "No changes to commit"
        
        # 3. Pull latest changes and resolve conflicts
        git pull origin main -s recursive -X ours
        
        # 4. Push safely to repository
        git push
